      function FoodPhoto({ foodId, nameTh, size = 'md', className = '' }) {
        const [err, setErr] = useState(false);
        const sizeClass =
          size === 'sm'
            ? 'w-12 h-12 rounded-lg'
            : size === 'lg'
            ? 'w-32 h-32 sm:w-36 sm:h-36 rounded-2xl'
            : size === 'fill'
            ? 'w-full h-full rounded-none'
            : 'w-16 h-16 rounded-xl';

        if (err) {
          return (
            <div className={`${sizeClass} bg-zinc-100 border border-zinc-300 flex items-center justify-center text-xs font-serif text-zinc-600 ${className}`}>
              料理
            </div>
          );
        }

        return (
          <div className={`relative overflow-hidden bg-zinc-900/5 shadow-sm ring-1 ring-black/10 ${sizeClass} ${className}`}>
            <img
              src={`./public/images/foods/${foodId}.jpg`}
              alt={nameTh || foodId}
              onError={() => setErr(true)}
              className="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105"
            />
            <div className="pointer-events-none absolute inset-0 ring-1 ring-inset ring-white/20 bg-gradient-to-tr from-black/10 via-transparent to-white/10" />

          slotBgClass: 'bg-white border-zinc-300 text-zinc-900',
          dotColor: 'bg-zinc-400',
        },
      };

      function App() {
        const [layoutId, setLayoutId] = useState('classic-4');
        const [boxTheme, setBoxTheme] = useState('hinoki');
        const [visualMode, setVisualMode] = useState('full-photo');
        const [activeCategory, setActiveCategory] = useState('all');
        const [searchQuery, setSearchQuery] = useState('');
        const [bentoSlots, setBentoSlots] = useState(() => ({
          'slot-1': {
            item: FOOD_ITEMS.find((f) => f.id === 'rice-koshihikari'),
            toppings: [FOOD_ITEMS.find((f) => f.id === 'top-furikake')],
          },
          'slot-2': {
            item: FOOD_ITEMS.find((f) => f.id === 'main-salmon-teriyaki'),
            toppings: [FOOD_ITEMS.find((f) => f.id === 'top-tobiko')],
          },
          'slot-3': {
            item: FOOD_ITEMS.find((f) => f.id === 'side-tamagoyaki'),
            toppings: [],
          },
          'slot-4': {
            item: FOOD_ITEMS.find((f) => f.id === 'sweet-matcha-mochi'),
            toppings: [],
          },
        }));
        const [draggedFoodId, setDraggedFoodId] = useState(null);
        const [draggedFromSlotId, setDraggedFromSlotId] = useState(null);
        const [dragOverSlotId, setDragOverSlotId] = useState(null);
        const [selectedFoodForTap, setSelectedFoodForTap] = useState(null);
        const [isLidClosed, setIsLidClosed] = useState(false);
        const [customLabel, setCustomLabel] = useState('特製御弁当 • Folk’s Crafted Bento');
        const [isOrderModalOpen, setIsOrderModalOpen] = useState(false);
        const [toastMessage, setToastMessage] = useState(null);

        const currentLayout = useMemo(
          () => BENTO_LAYOUTS.find((l) => l.id === layoutId) || BENTO_LAYOUTS[0],
          [layoutId]
        );

        const showToast = (msg) => {
          setToastMessage(msg);
          window.setTimeout(() => {
            setToastMessage((prev) => (prev === msg ? null : prev));
          }, 2400);
        };

        const filteredFoods = useMemo(() => {
          return FOOD_ITEMS.filter((item) => {
            const matchesCat = activeCategory === 'all' || item.category === activeCategory;
            const q = searchQuery.trim().toLowerCase();
            const matchesQuery =
              !q ||
              item.nameTh.toLowerCase().includes(q) ||
              item.nameJp.toLowerCase().includes(q) ||
              item.description.toLowerCase().includes(q);
            return matchesCat && matchesQuery;
          });
        }, [activeCategory, searchQuery]);

        const placeFoodInSlot = (slotId, food, sourceSlotId = null) => {
          if (isLidClosed) setIsLidClosed(false);
          if (food.category === 'topping') {
            const existing = bentoSlots[slot.id];
            if (!existing) {
              showToast('กรุณาเลือกอาหารหลักลงในช่องก่อนวางท็อปปิ้ง');
              return;
            }
            if (existing.toppings.some((t) => t.id === food.id)) {
              showToast(`มี ${food.nameTh} ในช่องนี้อยู่แล้ว`);
              return;
            }
            setBentoSlots((prev) => ({
              ...prev,
              [slotId]: {
                ...prev[slotId],
                toppings: [...prev[slotId].toppings, food],
              },
            }));
            showToast(`เพิ่มท็อปปิ้ง "${food.nameTh}" เรียบร้อย`);
            setSelectedFoodForTap(null);
            return;
          }

          setBentoSlots((prev) => {
            const next = { ...prev };
            if (sourceSlotId && sourceSlotId !== slotId) {
              const targetExisting = next[slotId];
              const sourceExisting = next[sourceSlotId];
              if (sourceExisting) {
                next[slotId] = sourceExisting;
                if (targetExisting) next[sourceSlotId] = targetExisting;
                else delete next[sourceSlotId];
              }
              return next;
            }
            next[slotId] = { item: food, toppings: [] };
            return next;
          });
          showToast(`จัดวาง "${food.nameTh}" ลงในช่องเรียบร้อย`);
          setSelectedFoodForTap(null);
        };

        const autoPlaceFood = (food) => {
          if (food.category === 'topping') {
            const firstFilled = currentLayout.slots.find((s) => Boolean(bentoSlots[s.id]));
            if (!firstFilled) {
              showToast('กรุณาใส่อาหารหลักในกล่องก่อนเพิ่มท็อปปิ้ง');
              return;
            }
            placeFoodInSlot(firstFilled.id, food);
            return;
          }
          const emptyMatching = currentLayout.slots.find(
            (s) => s.recommendedCategory === food.category && !bentoSlots[s.id]
          );
          if (emptyMatching) return placeFoodInSlot(emptyMatching.id, food);
          const anyEmpty = currentLayout.slots.find((s) => !bentoSlots[s.id]);
          if (anyEmpty) return placeFoodInSlot(anyEmpty.id, food);
          const matchingSlot =
            currentLayout.slots.find((s) => s.recommendedCategory === food.category) ||
            currentLayout.slots[0];
          placeFoodInSlot(matchingSlot.id, food);
        };

        const randomizeBento = () => {
          setIsLidClosed(false);
          const nextSlots = {};
          const toppingsPool = FOOD_ITEMS.filter((f) => f.category === 'topping');
          currentLayout.slots.forEach((slot) => {
            const pool = FOOD_ITEMS.filter((f) => f.category === slot.recommendedCategory);
            const randomItem = pool[Math.floor(Math.random() * pool.length)];
            if (randomItem) {
              const maybeTopping =
                (slot.recommendedCategory === 'base' || slot.recommendedCategory === 'main') &&
                Math.random() > 0.35
                  ? [toppingsPool[Math.floor(Math.random() * toppingsPool.length)]]
                  : [];
              nextSlots[slot.id] = { item: randomItem, toppings: maybeTopping };
            }
          });
          setBentoSlots(nextSlots);
          showToast('สุ่มจัดสำรับโอมากาเสะ (Omakase) เรียบร้อย');
        };

        const telemetry = useMemo(() => {
          let calories = 0, protein = 0, carbs = 0, fat = 0, foodPrice = 0, filledCount = 0;
          const colorSet = new Set();
          currentLayout.slots.forEach((slot) => {
            const entry = bentoSlots[slot.id];
            if (!entry) return;
            filledCount += 1;
            [entry.item, ...entry.toppings].forEach((f) => {
              calories += f.calories;
              protein += f.protein;
              carbs += f.carbs;
              fat += f.fat;
              foodPrice += f.price;
              f.washokuColors.forEach((c) => colorSet.add(c));
            });
          });
          const totalPrice = filledCount > 0 ? foodPrice + currentLayout.baseBoxFee : 0;
          const fillRatio = filledCount / currentLayout.slots.length;
          const colorRatio = colorSet.size / 5;
          const harmonyScore = Math.round((fillRatio * 0.55 + colorRatio * 0.45) * 100);
          return {
            calories,
            protein,
            carbs,
            fat: Math.round(fat * 10) / 10,
            totalPrice,
            filledCount,
            totalSlots: currentLayout.slots.length,
            colorsPresent: Array.from(colorSet),
            harmonyScore,
          };
        }, [bentoSlots, currentLayout]);

        const activeTheme = BOX_THEMES[boxTheme];

        return (
          <div className="min-h-screen bg-white text-zinc-900 pb-16">
            {toastMessage && (
              <div className="fixed bottom-6 right-6 z-50 bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-xs font-medium tracking-wide animate-pop-in">
                <span className="w-2 h-2 rounded-full bg-[#C83E2B]" />
                <span>{toastMessage}</span>
              </div>
            )}

            <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-zinc-200">
              <div className="max-w-[1440px] mx-auto px-4 sm:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3.5">
                  <div
                    className="w-11 h-11 rounded-lg bg-[#C83E2B] text-white flex flex-col items-center justify-center leading-none select-none"
                    style={{ fontFamily: "'Noto Serif JP', serif" }}
                  >
                    <span className="text-xs font-bold">特製</span>
                    <span className="text-xs font-bold">辨當</span>
                  </div>
                  <div>
                    <div className="flex items-center gap-2.5">
                      <h1 className="text-2xl font-bold tracking-[-0.02em] text-zinc-900">
                        BentoCraft Atelier
                      </h1>
                      <span className="text-xs font-semibold px-2.5 py-0.5 rounded bg-zinc-100 text-zinc-700 border border-zinc-300">
                        Impeccable Craft UI
                      </span>
                    </div>
                    <p className="text-sm text-zinc-600 mt-0.5">
                      สตูดิโอออกแบบสำรับเบนโตะญี่ปุ่น • ลากวางภาพถ่ายอาหารจริงและคำนวณสมดุลโภชนาการ 5 สี (五色)
                    </p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={randomizeBento}
                    className="text-xs font-semibold px-3.5 py-2 rounded-lg bg-zinc-900 hover:bg-[#C83E2B] text-white transition-colors"
                  >
                    สุ่มจัดสำรับ (Omakase)
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-[1440px] mx-auto px-4 sm:px-8 pt-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              {/* LEFT OSHINAGAKI MENU */}
              <section className="lg:col-span-5 xl:col-span-4 border border-zinc-200 rounded-2xl overflow-hidden flex flex-col bg-white">
                <div className="p-5 border-b border-zinc-200">
                  <div className="flex items-baseline justify-between gap-2 mb-1">
                    <h2 className="text-base font-bold text-zinc-900">รายการอาหาร (お品書き)</h2>
                    <span className="text-xs font-medium text-zinc-600 tabular-nums">{filteredFoods.length} รายการ</span>
                  </div>
                  <p className="text-sm text-zinc-600 mb-3.5">
                    ลากภาพเมนูไปยังช่องเบนโตะ หรือคลิกเลือกเมนูแล้วกดที่ช่องเป้าหมาย
                  </p>

                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="ค้นหาเมนู เช่น แซลมอน, วากิว, ไข่ม้วน, โมจิ..."
                    className="w-full px-3.5 py-2 mb-3 text-sm bg-zinc-50 text-zinc-900 placeholder:text-zinc-600 border border-zinc-300 rounded-lg focus:outline-none focus:border-zinc-900"
                  />

                  <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                    <button
                      onClick={() => setActiveCategory('all')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${
                        activeCategory === 'all'
                          ? 'bg-zinc-900 text-white'
                          : 'bg-zinc-100 text-zinc-700'
                      }`}
                    >
                      ทั้งหมด
                    </button>
                    {Object.keys(IMPECCABLE_CATEGORY_META).map((cat) => {
                      const meta = IMPECCABLE_CATEGORY_META[cat];
                      const active = activeCategory === cat;
                      return (
                        <button
                          key={cat}
                          onClick={() => setActiveCategory(cat)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap flex items-center gap-1.5 ${
                            active ? 'bg-zinc-900 text-white' : 'bg-zinc-100 text-zinc-700'
                          }`}
                        >
                          <span className="text-xs" style={{ fontFamily: "'Noto Serif JP', serif" }}>
                            {meta.kanji}
                          </span>
                          <span>{meta.labelTh}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="divide-y divide-zinc-200 max-h-[640px] overflow-y-auto">
                  {filteredFoods.map((food) => {
                    const catMeta = IMPECCABLE_CATEGORY_META[food.category];
                    const isSelected = selectedFoodForTap?.id === food.id;
                    return (
                      <div
                        key={food.id}
                        draggable
                        onDragStart={(e) => {
                          e.dataTransfer.setData('text/plain', food.id);
                          setDraggedFoodId(food.id);
                          setDraggedFromSlotId(null);
                        }}
                        onDragEnd={() => {
                          setDraggedFoodId(null);
                          setDragOverSlotId(null);
                        }}
                        onClick={() =>
                          setSelectedFoodForTap((prev) => (prev?.id === food.id ? null : food))
                        }
                        className={`group p-4 sm:px-5 flex items-center gap-3.5 transition-colors cursor-grab active:cursor-grabbing ${
                          isSelected ? 'bg-zinc-100' : 'hover:bg-zinc-50'
                        }`}
                      >
                        <FoodPhoto foodId={food.id} nameTh={food.nameTh} size="md" />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between gap-2">
                            <span className="text-xs font-medium text-zinc-600">
                              {catMeta.kanji} • {catMeta.labelTh}
                            </span>
                            <span className="text-xs font-bold text-zinc-900 tabular-nums">฿{food.price}</span>
                          </div>
                          <h3 className="text-sm font-bold text-zinc-900 truncate mt-0.5">{food.nameTh}</h3>
                          <p className="text-sm text-zinc-600 line-clamp-1 mt-0.5">{food.description}</p>
                          <div className="flex items-center justify-between mt-2 text-xs tabular-nums text-zinc-600">
                            <span>{food.calories} kcal • P {food.protein}g • C {food.carbs}g</span>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                autoPlaceFood(food);
                              }}
                              className="px-2.5 py-1 rounded-md bg-zinc-100 group-hover:bg-zinc-900 text-zinc-900 group-hover:text-white text-xs font-semibold transition-colors"
                            >
                              + จัดวาง
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>

              {/* RIGHT BENTO WORKSPACE */}
              <section className="lg:col-span-7 xl:col-span-8 space-y-6">
                <div className="pb-5 border-b border-zinc-200 flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h2 className="text-sm font-bold text-zinc-900 mb-2">
                      รูปทรงกล่องเบนโตะ
                    </h2>
                    <div className="flex flex-wrap gap-2">
                      {BENTO_LAYOUTS.map((l) => (
                        <button
                          key={l.id}
                          onClick={() => setLayoutId(l.id)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors ${
                            l.id === layoutId
                              ? 'bg-zinc-900 text-white border-zinc-900'
                              : 'bg-white text-zinc-700 border-zinc-300'
                          }`}
                        >
                          {l.nameTh} ({l.slots.length} ช่อง)
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <h2 className="text-sm font-bold text-zinc-900 mb-2">
                      วัสดุภาชนะ
                    </h2>
                    <div className="flex flex-wrap gap-2">
                      {Object.keys(BOX_THEMES).map((tid) => (
                        <button
                          key={tid}
                          onClick={() => setBoxTheme(tid)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-2 ${
                            boxTheme === tid
                              ? 'bg-zinc-900 text-white border-zinc-900'
                              : 'bg-white text-zinc-700 border-zinc-300'
                          }`}
                        >
                          <span className={`w-2.5 h-2.5 rounded-full ${BOX_THEMES[tid].dotColor}`} />
                          <span>{BOX_THEMES[tid].nameTh}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* HERO BENTO BOX */}
                <div>
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div>
                      <div className="flex items-baseline gap-2.5">
                        <h2 className="text-lg font-bold text-zinc-900">{currentLayout.nameTh}</h2>
                        <span className="text-xs text-zinc-600" style={{ fontFamily: "'Noto Serif JP', serif" }}>
                          {currentLayout.nameJp}
                        </span>
                      </div>
                      <p className="text-sm text-zinc-600 mt-0.5">{currentLayout.description}</p>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => setVisualMode((p) => (p === 'full-photo' ? 'plated' : 'full-photo'))}
                        className="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 text-zinc-900"
                      >
                        {visualMode === 'full-photo' ? 'มุมมอง: ภาพถ่ายเต็มช่อง' : 'มุมมอง: จัดจาน'}
                      </button>
                      <button
                        onClick={() => setIsLidClosed((p) => !p)}
                        className="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 text-zinc-900"
                      >
                        {isLidClosed ? 'เปิดฝากล่องเบนโตะ' : 'คาดสายโอบิ & ปิดฝา'}
                      </button>
                      <button
                        onClick={() => setBentoSlots({})}
                        className="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-600 hover:text-[#C83E2B]"
                      >
                        ล้างกล่อง
                      </button>
                    </div>
                  </div>

                  <div className={`rounded-[28px] transition-all ${activeTheme.outerClass}`}>
                    {isLidClosed ? (
                      <div className="min-h-[380px] rounded-[18px] bg-zinc-900 flex flex-col items-center justify-center p-6 text-center text-white relative overflow-hidden animate-pop-in">
                        <div className="absolute inset-y-0 w-32 bg-white border-x-2 border-[#C83E2B] shadow-2xl" />
                        <div className="relative z-10 bg-white text-zinc-900 p-6 rounded-xl shadow-2xl max-w-sm w-full">
                          <h3 className="text-sm font-bold text-zinc-900 mb-2">ป้ายชื่อสายคาดกล่องเบนโตะ</h3>
                          <input
                            type="text"
                            value={customLabel}
                            onChange={(e) => setCustomLabel(e.target.value)}
                            className="w-full text-center font-bold text-sm bg-zinc-50 border border-zinc-300 rounded-lg px-3 py-2"
                          />
                          <div className="mt-3 pt-3 border-t border-zinc-200 text-xs text-zinc-600 tabular-nums">
                            {telemetry.filledCount}/{telemetry.totalSlots} ช่อง • {telemetry.calories} kcal • ฿{telemetry.totalPrice}
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className={`grid ${currentLayout.gridContainerClass} ${activeTheme.dividerClass}`}>
                        {currentLayout.slots.map((slot, idx) => {
                          const slotted = bentoSlots[slot.id];
                          const recMeta = IMPECCABLE_CATEGORY_META[slot.recommendedCategory];
                          const isOver = dragOverSlotId === slot.id;
                          const slotNumber = String(idx + 1).padStart(2, '0');
                          return (
                            <div
                              key={slot.id}
                              onDragOver={(e) => {
                                e.preventDefault();
                                setDragOverSlotId(slot.id);
                              }}
                              onDragLeave={() => setDragOverSlotId(null)}
                              onDrop={(e) => {
                                e.preventDefault();
                                setDragOverSlotId(null);
                                const id = e.dataTransfer.getData('text/plain') || draggedFoodId;
                                const food = FOOD_ITEMS.find((f) => f.id === id);
                                if (food) placeFoodInSlot(slot.id, food, draggedFromSlotId);
                                setDraggedFoodId(null);
                                setDraggedFromSlotId(null);
                              }}
                              onClick={() => {
                                if (selectedFoodForTap) placeFoodInSlot(slot.id, selectedFoodForTap);
                              }}
                              className={`${slot.gridSpanClass} ${slot.minHeightClass} group relative rounded-[12px] border overflow-hidden transition-all ${
                                activeTheme.slotBgClass
                              } ${isOver ? 'ring-2 ring-[#C83E2B]' : ''}`}
                            >
                              {slotted && visualMode === 'full-photo' ? (
                                <div
                                  draggable
                                  onDragStart={(e) => {
                                    e.dataTransfer.setData('text/plain', slotted.item.id);
                                    setDraggedFoodId(slotted.item.id);
                                    setDraggedFromSlotId(slot.id);
                                  }}
                                  className="relative w-full h-full min-h-[inherit] flex flex-col justify-between p-3.5 cursor-grab animate-pop-in"
                                >
                                  <div className="absolute inset-0 z-0">
                                    <FoodPhoto foodId={slotted.item.id} nameTh={slotted.item.nameTh} size="fill" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/15 to-black/50" />
                                  </div>

                                  <div className="relative z-10 flex items-center justify-between gap-2">
                                    <span className="text-xs font-semibold px-2.5 py-0.5 rounded bg-black/75 text-white tabular-nums">
                                      {slotNumber} • {recMeta.kanji}
                                    </span>
                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setBentoSlots((prev) => {
                                          const n = { ...prev };
                                          delete n[slot.id];
                                          return n;
                                        });
                                      }}
                                      className="px-2.5 py-0.5 rounded bg-black/75 hover:bg-[#C83E2B] text-white text-xs font-medium"
                                    >
                                      นำออก
                                    </button>
                                  </div>

                                  {slotted.toppings.length > 0 && (
                                    <div className="relative z-10 my-auto flex flex-wrap justify-end gap-1.5">
                                      {slotted.toppings.map((t) => (
                                        <div
                                          key={t.id}
                                          className="flex items-center gap-1.5 pl-1 pr-2.5 py-0.5 rounded-full bg-black/80 text-white text-xs font-medium"
                                        >
                                          <FoodPhoto foodId={t.id} nameTh={t.nameTh} size="sm" className="!w-5 !h-5 !rounded-full" />
                                          <span>+{t.nameTh}</span>
                                        </div>
                                      ))}
                                    </div>
                                  )}

                                  <div className="relative z-10 flex items-end justify-between gap-2 pt-2">
                                    <div>
                                      <div className="text-xs text-zinc-200" style={{ fontFamily: "'Noto Serif JP', serif" }}>
                                        {slotted.item.nameJp}
                                      </div>
                                      <h3 className="text-base font-bold text-white leading-snug">
                                        {slotted.item.nameTh}
                                      </h3>
                                    </div>
                                    <div className="text-right bg-black/75 px-2.5 py-1 rounded-lg text-white tabular-nums">
                                      <div className="text-xs text-zinc-200">{slotted.item.calories} kcal</div>
                                      <div className="text-xs font-bold">฿{slotted.item.price}</div>
                                    </div>
                                  </div>
                                </div>
                              ) : slotted ? (
                                <div className="p-3.5 h-full flex flex-col justify-between">
                                  <div className="flex justify-between text-xs tabular-nums">
                                    <span>{slotNumber} • {recMeta.labelTh}</span>
                                    <button
                                      onClick={() =>
                                        setBentoSlots((prev) => {
                                          const n = { ...prev };
                                          delete n[slot.id];
                                          return n;
                                        })
                                      }
                                      className="text-[#C83E2B]"
                                    >
                                      นำออก
                                    </button>
                                  </div>
                                  <div className="my-auto py-2 flex flex-col items-center text-center">
                                    <FoodPhoto foodId={slotted.item.id} nameTh={slotted.item.nameTh} size="lg" />
                                    <h3 className="mt-2 text-sm font-bold">{slotted.item.nameTh}</h3>
                                  </div>
                                  <div className="flex justify-between text-xs tabular-nums">
                                    <span>{slotted.item.calories} kcal</span>
                                    <span className="font-bold">฿{slotted.item.price}</span>
                                  </div>
                                </div>
                              ) : (
                                <div className="p-3.5 h-full min-h-[inherit] flex flex-col justify-between">
                                  <div className="flex justify-between text-xs tabular-nums">
                                    <span className="font-bold">{slotNumber}</span>
                                    <span style={{ fontFamily: "'Noto Serif JP', serif" }}>{recMeta.kanji} • {recMeta.labelTh}</span>
                                  </div>
                                  <div className="my-auto py-4 text-center">
                                    <div className="text-lg font-serif mb-1" style={{ fontFamily: "'Noto Serif JP', serif" }}>{recMeta.kanji}</div>
                                    <p className="text-sm font-medium">ลากภาพเมนูมาวางในช่องนี้</p>
                                  </div>
                                  <div className="text-xs">ว่าง</div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                {/* ARCHITECTURAL TELEMETRY LEDGER */}
                <div className="pt-6 border-t border-zinc-200 grid grid-cols-1 md:grid-cols-12 gap-8">
                  <div className="md:col-span-7">
                    <div className="flex items-baseline justify-between mb-3">
                      <h2 className="text-base font-bold text-zinc-900">สัดส่วนพลังงานและสารอาหารรวม</h2>
                      <div className="text-right tabular-nums">
                        <span className="text-2xl font-bold text-zinc-900">{telemetry.calories}</span>
                        <span className="text-xs text-zinc-600 ml-1">kcal / 850 kcal</span>
                      </div>
                    </div>
                    <div className="w-full h-2 bg-zinc-200 rounded-full overflow-hidden mb-5">
                      <div className="h-full bg-zinc-900 transition-all duration-300" style={{ width: `${Math.min(100, (telemetry.calories / 850) * 100)}%` }} />
                    </div>
                    <div className="grid grid-cols-3 divide-x divide-zinc-200 border-t border-b border-zinc-200 py-3.5 tabular-nums">
                      <div className="pr-4">
                        <div className="flex items-center gap-1.5 text-xs text-zinc-600">
                          <span className="w-2 h-2 rounded-full bg-[#C83E2B]" />
                          <span>โปรตีน (Protein)</span>
                        </div>
                        <div className="text-lg font-bold text-zinc-900 mt-1">{telemetry.protein}g</div>
                      </div>
                      <div className="px-4">
                        <div className="flex items-center gap-1.5 text-xs text-zinc-600">
                          <span className="w-2 h-2 rounded-full bg-[#B58448]" />
                          <span>คาร์บ (Carbs)</span>
                        </div>
                        <div className="text-lg font-bold text-zinc-900 mt-1">{telemetry.carbs}g</div>
                      </div>
                      <div className="pl-4">
                        <div className="flex items-center gap-1.5 text-xs text-zinc-600">
                          <span className="w-2 h-2 rounded-full bg-zinc-600" />
                          <span>ไขมัน (Fat)</span>
                        </div>
                        <div className="text-lg font-bold text-zinc-900 mt-1">{telemetry.fat}g</div>
                      </div>
                    </div>
                  </div>

                  <div className="md:col-span-5 flex flex-col justify-between">
                    <div>
                      <div className="flex items-baseline justify-between mb-1">
                        <h2 className="text-base font-bold text-zinc-900">
                          สมดุลสีอาหาร 5 สี (五色)
                        </h2>
                        <span className="text-xs font-bold text-zinc-900 tabular-nums">
                          ความสมดุล {telemetry.harmonyScore}/100
                        </span>
                      </div>
                      <p className="text-sm text-zinc-600 mb-3">
                        สมดุลสีอาหาร 5 สีตามหลักโภชนาการญี่ปุ่น
                      </p>
                      <div className="flex flex-wrap gap-2 mb-4">
                        {Object.keys(WASHOKU_COLOR_META).map((colorKey) => {
                          const meta = WASHOKU_COLOR_META[colorKey];
                          const achieved = telemetry.colorsPresent.includes(colorKey);
                          return (
                            <span
                              key={colorKey}
                              className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${
                                achieved ? 'bg-zinc-900 text-white' : 'bg-zinc-100 text-zinc-600'
                              }`}
                            >
                              <span className={`w-2.5 h-2.5 rounded-full ${meta.dotClass}`} />
                              <span>{meta.nameTh}</span>
                            </span>
                          );
                        })}
                      </div>
                    </div>

                    <div className="pt-4 border-t border-zinc-200 flex items-center justify-between gap-3">
                      <div className="tabular-nums">
                        <div className="text-xs text-zinc-600">ยอดรวมสุทธิ</div>
                        <div className="text-2xl font-bold text-zinc-900">฿{telemetry.totalPrice}</div>
                      </div>
                      <button
                        onClick={() => setIsOrderModalOpen((p) => !p)}
                        className="flex-1 py-3 px-4 rounded-xl bg-[#C83E2B] hover:bg-[#A83221] text-white font-semibold text-xs tracking-wide transition-colors"
                      >
                        {isOrderModalOpen ? 'ซ่อนใบสรุปรายการ' : 'ดูใบสรุปรายการสั่งทำ'}
                      </button>
                    </div>
                  </div>
                </div>
              </section>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
