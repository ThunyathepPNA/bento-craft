        if (meat === 'ทะเล' || meat === 'กุ้ง' || meat === 'ปลาดอลลี่') return true;
        if (meat === 'หมู' || meat === 'หมูสับ' || meat === 'ไก่' || meat === 'ไก่กรอบ' || meat === 'เนื้อวัว') return false;
        return fallbackTier === 'seafood';
      }

      function loadImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
      }

      function drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawCoverImage(ctx, img, x, y, w, h, radius) {
        ctx.save();
        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.clip();
        const imgRatio = img.width / img.height;
        const boxRatio = w / h;
        let drawW = w;
        let drawH = h;
        let offsetX = x;
        let offsetY = y;
        if (imgRatio > boxRatio) {
          drawW = h * imgRatio;
          offsetX = x - (drawW - w) / 2;
        } else {
          drawH = w / imgRatio;
          offsetY = y - (drawH - h) / 2;
        }
        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
        ctx.restore();
      }

      function FoodThumb({ item, selectedMeat, size = 'sm' }) {
        const [err, setErr] = useState(false);
        const activeCropSrc =
          (selectedMeat && item.meatPhotoMap?.[selectedMeat]?.cropImage) || item.cropImage;

        if (size === 'sm') {
          if (item.hasRealPhoto && activeCropSrc && !err) {
            return (
              <div className="relative w-14 h-14 rounded-full bg-white border-2 border-zinc-200 shadow-sm overflow-hidden shrink-0">
                <img
                  src={activeCropSrc}
                  alt={item.nameTh}
                  draggable={false}
                  onError={() => setErr(true)}
                  className="w-full h-full object-cover object-center"
                />
              </div>
            );
          }
          return (
            <div className="relative w-14 h-14 rounded-full bg-amber-50 text-amber-900 border-2 border-dashed border-amber-300 flex items-center justify-center text-center p-1 shrink-0">
              <span className="text-xs font-bold leading-none">รอรูป</span>
            </div>
          );
        }

        if (item.hasRealPhoto && activeCropSrc && !err) {
          return (
            <img
              src={activeCropSrc}
              alt={item.nameTh}
              draggable={false}
              onError={() => setErr(true)}
              className="w-full h-full object-cover object-center"

        );

      function App() {
        const [layoutId, setLayoutId] = useState('box-3slot');
        const [viewMode, setViewMode] = useState('compartment');
        const [onlyRealPhotos, setOnlyRealPhotos] = useState(false);
        const [activeCategory, setActiveCategory] = useState('all');
        const [searchQuery, setSearchQuery] = useState('');
        const [boxCount, setBoxCount] = useState(10);
        const [customerNote, setCustomerNote] = useState('ชุดจัดเบรกประชุม • ข้าวกล่อง ZeedKitchen');
        const [selectedSlotId, setSelectedSlotId] = useState('slot-main');
        const [draggedFoodId, setDraggedFoodId] = useState(null);
        const [copiedToast, setCopiedToast] = useState(false);

        const [menuMeatPrefs, setMenuMeatPrefs] = useState(() => {
          const prefs = {};
          FOOD_ITEMS.forEach((f) => {
            if (f.defaultMeat) prefs[f.id] = f.defaultMeat;
          });
          return prefs;
        });

        const [slots, setSlots] = useState(() => {
          const find = (id) => FOOD_ITEMS.find((f) => f.id === id);
          return {
            'slot-side': { item: find('base-salad-sauce'), toppings: [] },
            'slot-main': { item: find('menu-20-chicken-teriyaki'), toppings: [] },
            'slot-foil': { item: find('top-steamed-egg'), toppings: [] },
            'slot-rice': { item: find('base-jasmine-rice'), toppings: [find('top-fried-egg')] },
            'slot-dish': { item: find('menu-03-panang'), selectedMeat: 'ไก่', toppings: [] },
          };
        });

        const currentLayout = useMemo(
          () => BENTO_LAYOUTS.find((l) => l.id === layoutId) || BENTO_LAYOUTS[0],
          [layoutId]
        );

        const filteredFoods = useMemo(() => {
          return FOOD_ITEMS.filter((item) => {
            if (onlyRealPhotos && !item.hasRealPhoto) return false;
            const matchesCat = activeCategory === 'all' || item.category === activeCategory;
            const q = searchQuery.trim().toLowerCase();
            return (
              matchesCat &&
              (!q ||
                item.nameTh.toLowerCase().includes(q) ||
                item.subNameTh.toLowerCase().includes(q))
            );
          });
        }, [onlyRealPhotos, activeCategory, searchQuery]);

        const pricing = useMemo(() => {
          let seafoodCount = 0;
          let addonTotal = 0;
          for (const slot of currentLayout.slots) {
            const sl = slots[slot.id];
            if (!sl) continue;
            if (isSeafoodMeat(sl.selectedMeat, sl.item.meatTier)) seafoodCount += 1;
            for (const top of sl.toppings) addonTotal += top.addonPrice;
          }
          let baseSetPrice =
            layoutId === 'box-2slot'
              ? seafoodCount >= 1
                ? 70
                : 50
              : seafoodCount >= 2
              ? 120
              : seafoodCount === 1
              ? 100
              : 80;
          let setName =
            layoutId === 'box-2slot'
              ? seafoodCount >= 1
                ? 'เซตเริ่มต้น เมนูทะเล (กล่อง 2 ช่อง) 70.-'
                : 'เซตเริ่มต้น อิ่มคุ้ม 50.- (หมู/ไก่)'
              : seafoodCount >= 2
              ? 'เซตซีฟู้ดเลิฟเวอร์ 120.- (ทะเล 2 อย่าง)'
              : seafoodCount === 1
              ? 'เซตยอดนิยม รวมทะเล 100.- (ทะเล 1 + หมู/ไก่ 1)'
              : 'เซตจุใจ ได้ 2 อย่าง 80.- (หมู/ไก่ 2 อย่าง)';
          const unitPrice = baseSetPrice + addonTotal;
          const mainSlotId = layoutId === 'box-3slot' ? 'slot-main' : 'slot-dish';
          const mainSl = slots[mainSlotId];
          const customBox =
            mainSl?.selectedMeat &&
            mainSl?.item?.meatPhotoMap?.[mainSl.selectedMeat]?.fullBoxImage;
          const referenceBoxPhoto =
            customBox ||
            mainSl?.item?.fullBoxImage ||
            './public/images/zeed/box-chicken-teriyaki-steamed-egg.jpg';

          return {
            baseSetPrice,
            addonTotal,
            unitPrice,
            grandTotal: unitPrice * boxCount,
            setName,
            referenceBoxPhoto,
          };
        }, [currentLayout, slots, layoutId, boxCount]);

        const applyPreset = (preset) => {
          setLayoutId(preset.layoutId);
          const next = { ...slots };
          Object.entries(preset.slots).forEach(([slotId, cfg]) => {
            const item = FOOD_ITEMS.find((f) => f.id === cfg.itemId);
            if (item) {
              const tops = (cfg.toppingIds || [])
                .map((id) => FOOD_ITEMS.find((f) => f.id === id))
                .filter(Boolean);
              next[slotId] = {
                item,
                selectedMeat: cfg.selectedMeat || item.defaultMeat,
                toppings: tops,
              };
            }
          });
          setSlots(next);
        };

        const placeFood = (slotId, food, meatOverride) => {
          const slotConfig = currentLayout.slots.find((s) => s.id === slotId);
          if (food.category === 'topping' && !slotConfig?.isFoilCup) {
            setSlots((prev) => {
              const ex = prev[slotId];
              if (!ex) return { ...prev, [slotId]: { item: food, toppings: [] } };
              const has = ex.toppings.some((t) => t.id === food.id);
              return {
                ...prev,
                [slotId]: {
                  ...ex,
                  toppings: has ? ex.toppings.filter((t) => t.id !== food.id) : [food],
                },
              };
            });
            return;
          }
          const chosenMeat = meatOverride || menuMeatPrefs[food.id] || food.defaultMeat;
          setSlots((prev) => ({
            ...prev,
            [slotId]: {
              item: food,
              selectedMeat: chosenMeat,
              toppings: prev[slotId]?.toppings || [],
            },
          }));
        };

        const formatSlotTitle = (sl) => {
          if (!sl) return '(ว่าง)';
          return `${sl.item.nameTh}${sl.selectedMeat ? ` (${sl.selectedMeat})` : ''}`;
        };

        const copyOrderSummary = () => {
          const lines = currentLayout.slots.map((s, idx) => {
            const sl = slots[s.id];
            if (!sl) return `${idx + 1}. ${s.labelTh}: (ว่าง)`;
            const topText =
              sl.toppings.length > 0
                ? ` + โปะท็อปปิ้ง [${sl.toppings.map((t) => `${t.nameTh} +${t.addonPrice}฿`).join(', ')}]`
                : '';
            return `${idx + 1}. ${s.labelTh}: ${formatSlotTitle(sl)}${topText}`;
          });
          const summary = [
            `🍱 ใบสั่งชุดข้าวกล่อง ZeedKitchen (แค่คิด...ก็อร่อย)`,
            `หมายเหตุ: ${customerNote}`,
            `แพ็กเกจราคา: ${pricing.setName}`,
            `--------------------------`,
            ...lines,
            `--------------------------`,
            `ราคาต่อกล่อง: ${pricing.unitPrice} บาท`,
            `จำนวนที่สั่ง: ${boxCount} กล่อง`,
            `ยอดรวมทั้งหมด: ${pricing.grandTotal.toLocaleString()} บาท`,
            `โทรสั่งร้าน ZeedKitchen: 095-945-3591 (จัดส่งทั่วระยอง)`,
          ].join('\n');
          navigator.clipboard?.writeText(summary);
          setCopiedToast(true);
          setTimeout(() => setCopiedToast(false), 2500);
        };

        const downloadPng = async () => {
          const canvas = document.createElement('canvas');
          canvas.width = 1280;
          canvas.height = 820;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#18181B';
          ctx.fillRect(0, 0, canvas.width, 108);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 30px Prompt, sans-serif';
          ctx.fillText('ZeedKitchen BentoCraft — ใบสั่งชุดข้าวกล่อง', 40, 54);
          ctx.fillStyle = '#D4D4D8';
          ctx.font = '500 18px Prompt, sans-serif';
          ctx.fillText('ซี้ดคิทเช่น (แค่คิด...ก็อร่อย) • โทร. 095-945-3591 • จัดส่งทั่วระยอง', 40, 84);

          drawRoundedRect(ctx, 36, 136, 680, 520, 28);
          ctx.fillStyle = '#18181B';
          ctx.fill();

          const slotRects =
            layoutId === 'box-3slot'
              ? [
                  { id: 'slot-side', x: 70, y: 170, w: 256, h: 218 },
                  { id: 'slot-foil', x: 70, y: 404, w: 256, h: 218 },
                  { id: 'slot-main', x: 342, y: 170, w: 340, h: 452 },
                ]
              : [
                  { id: 'slot-rice', x: 70, y: 170, w: 260, h: 452 },
                  { id: 'slot-dish', x: 346, y: 170, w: 336, h: 452 },
                ];

          for (const sr of slotRects) {
            const sl = slots[sr.id];
            drawRoundedRect(ctx, sr.x, sr.y, sr.w, sr.h, 14);
            ctx.fillStyle = '#F4F4F5';
            ctx.fill();
            if (sl) {
              const cropSrc =
                (sl.selectedMeat && sl.item.meatPhotoMap?.[sl.selectedMeat]?.cropImage) ||
                sl.item.cropImage;
              if (sl.item.hasRealPhoto && cropSrc) {
                const fImg = await loadImage(cropSrc);
                if (fImg) drawCoverImage(ctx, fImg, sr.x, sr.y, sr.w, sr.h, 14);
              }
              drawRoundedRect(ctx, sr.x + 12, sr.y + sr.h - 44, sr.w - 24, 32, 16);
              ctx.fillStyle = 'rgba(255,255,255,0.94)';
              ctx.fill();
              ctx.fillStyle = '#18181B';
              ctx.font = 'bold 15px Prompt, sans-serif';
              ctx.fillText(formatSlotTitle(sl).slice(0, 32), sr.x + 24, sr.y + sr.h - 22);
            }
          }

          drawRoundedRect(ctx, 746, 136, 498, 640, 24);
          ctx.fillStyle = '#FAFAFA';
          ctx.fill();
          ctx.fillStyle = '#18181B';
          ctx.font = 'bold 24px Prompt, sans-serif';
          ctx.fillText('สรุปรายการข้าวกล่องที่จัด', 776, 184);
          ctx.fillStyle = '#365314';
          ctx.font = 'bold 16px Prompt, sans-serif';
          ctx.fillText(pricing.setName, 776, 224);

          let curY = 276;
          currentLayout.slots.forEach((slot, idx) => {
            const sl = slots[slot.id];
            ctx.fillStyle = '#71717A';
            ctx.font = '600 14px Prompt, sans-serif';
            ctx.fillText(`หลุม 0${idx + 1} • ${slot.labelTh}`, 776, curY);
            curY += 24;
            ctx.fillStyle = '#18181B';
            ctx.font = 'bold 17px Prompt, sans-serif';
            ctx.fillText(formatSlotTitle(sl), 776, curY);
            curY += 34;
          });

          drawRoundedRect(ctx, 776, 652, 438, 96, 16);
          ctx.fillStyle = '#18181B';
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 30px Prompt, sans-serif';
          ctx.fillText(`${boxCount} กล่อง • รวม ฿${pricing.grandTotal.toLocaleString()}`, 800, 712);

          const link = document.createElement('a');
          link.download = `ZeedKitchen-Bento-${boxCount}boxes.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };

        return (
          <div className="min-h-screen bg-white text-zinc-900 flex flex-col pb-20 lg:pb-0">
            <header className="sticky top-0 z-30 bg-white border-b border-zinc-200">
              <div className="max-w-[1440px] mx-auto px-4 sm:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3.5">
                  <img
                    src="./public/images/zeed/logo.jpg"
                    alt="ZeedKitchen Logo"
                    className="w-12 h-12 rounded-xl object-cover border border-zinc-200"
                  />
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-2xl font-bold tracking-[-0.02em] text-zinc-900">
                        ZeedKitchen BentoCraft
                      </h1>
                      <span className="text-xs font-semibold px-2.5 py-0.5 rounded bg-lime-100 text-lime-900 border border-lime-300">
                        แค่คิด...ก็อร่อย • จัดส่งทั่วระยอง
                      </span>
                    </div>
                    <p className="text-sm text-zinc-600 mt-0.5">
                      จำลองจัดชุดข้าวกล่องถาดดำของจริง • เลือกเนื้อสัตว์ หมู/ไก่/ทะเล & บันทึกรูปส่ง LINE • โทร. 095-945-3591
                    </p>
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-1.5">
                  {REAL_BOX_PRESETS.map((p) => (
                    <button
                      key={p.id}
                      onClick={() => applyPreset(p)}
                      className="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-800 border border-zinc-300"
                    >
                      {p.nameTh} ({p.price}.-)
                    </button>
                  ))}
                </div>
              </div>
            </header>

            <main className="max-w-[1440px] w-full mx-auto px-4 sm:px-8 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <section className="lg:col-span-5 bg-white rounded-2xl border border-zinc-200 overflow-hidden">
                <div className="p-4 sm:p-5 border-b border-zinc-200">
                  <div className="flex items-baseline justify-between mb-1">
                    <h2 className="text-lg font-bold text-zinc-900">จานเมนูเลือกจัดลงกล่อง</h2>
                    <span className="text-xs font-medium text-zinc-600">{filteredFoods.length} รายการ</span>
                  </div>
                  <p className="text-sm text-zinc-600 mb-3">
                    กดเลือกชนิดเนื้อสัตว์ (หมู/ไก่/ทะเล) แล้วคลิกหรือลากใส่หลุมกล่องเบนโตะได้ทันที
                  </p>
                  <div className="flex gap-2 mb-3">
                    <button
                      onClick={() => setOnlyRealPhotos(false)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                        !onlyRealPhotos ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-zinc-100 text-zinc-700 border-zinc-300'
                      }`}
                    >
                      แสดงทุกเมนู ({FOOD_ITEMS.length})
                    </button>
                    <button
                      onClick={() => setOnlyRealPhotos(true)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                        onlyRealPhotos ? 'bg-lime-800 text-white border-lime-800' : 'bg-zinc-100 text-zinc-700 border-zinc-300'
                      }`}
                    >
                      เฉพาะเมนูที่มีรูปถ่ายจริงแล้ว
                    </button>
                  </div>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="ค้นหาเมนู เช่น กะเพรา, พะแนง, ซาบะ, ต้มยำ, ไข่ดาว, ไข่ตุ๋น..."
                    className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-xl text-sm text-zinc-900 placeholder:text-zinc-600 mb-3"
                  />
                  <div className="flex gap-1.5 overflow-x-auto pb-1">
                    <button
                      onClick={() => setActiveCategory('all')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${
                        activeCategory === 'all' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-zinc-100 text-zinc-700 border-zinc-300'
                      }`}
                    >
                      ทั้งหมด
                    </button>
                    {Object.keys(ZEED_CATEGORY_META).map((k) => (
                      <button
                        key={k}
                        onClick={() => setActiveCategory(k)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap border ${
                          activeCategory === k ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-zinc-100 text-zinc-700 border-zinc-300'
                        }`}
                      >
                        {ZEED_CATEGORY_META[k].shortTh}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="p-3 max-h-[600px] overflow-y-auto divide-y divide-zinc-200">
                  {filteredFoods.map((food) => {
                    const activeMeat = menuMeatPrefs[food.id] || food.defaultMeat;
                    const isSeafood = isSeafoodMeat(activeMeat, food.meatTier);
                    return (
                      <div
                        key={food.id}
                        draggable
                        onDragStart={() => setDraggedFoodId(food.id)}
                        onClick={() => placeFood(selectedSlotId, food, activeMeat)}
                        className="py-3 px-2.5 flex items-center gap-3.5 cursor-pointer hover:bg-zinc-50 rounded-xl"
                      >
                        <FoodThumb item={food} selectedMeat={activeMeat} size="sm" />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-baseline justify-between gap-2">
                            <span className="text-sm font-semibold text-zinc-900 truncate">
                              {food.nameTh}
                              {activeMeat ? ` (${activeMeat})` : ''}
                            </span>
                            <span className={`text-xs font-bold shrink-0 ${isSeafood ? 'text-[#C83E2B]' : 'text-zinc-900'}`}>
                              {food.category === 'topping' ? `+${food.addonPrice} ฿` : isSeafood ? 'เรตทะเล' : 'เรตหมู/ไก่'}
                            </span>
                          </div>
                          {food.availableMeats && food.availableMeats.length > 1 && (
                            <div className="flex flex-wrap items-center gap-1 mt-1.5">
                              <span className="text-xs text-zinc-600 mr-1">เนื้อสัตว์:</span>
                              {food.availableMeats.map((meat) => (
                                <button
                                  key={meat}
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setMenuMeatPrefs((prev) => ({ ...prev, [food.id]: meat }));
                                    setSlots((prev) => {
                                      const next = { ...prev };
                                      Object.keys(next).forEach((k) => {
                                        if (next[k]?.item.id === food.id) {
                                          next[k] = { ...next[k], selectedMeat: meat };
                                        }
                                      });
                                      return next;
                                    });
                                  }}
                                  className={`px-2 py-0.5 rounded text-xs font-semibold border ${
                                    activeMeat === meat
                                      ? 'bg-zinc-900 text-white border-zinc-900'
                                      : 'bg-white text-zinc-700 border-zinc-300'
                                  }`}
                                >
                                  {meat}
                                </button>
                              ))}
                            </div>
                          )}
                          <div className="flex items-center gap-1.5 mt-1.5">
                            <span className={`text-xs font-medium px-2 py-0.5 rounded border ${food.hasRealPhoto ? 'bg-lime-50 text-lime-900 border-lime-300' : 'bg-amber-50 text-amber-900 border-amber-300'}`}>
                              {food.hasRealPhoto ? 'มีรูปถ่ายจริง' : 'รอถ่ายรูปจริง'}
                            </span>
                            <span className="text-xs text-zinc-600 truncate">{food.subNameTh}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>

              <section className="lg:col-span-7 space-y-5">
                <div className="bg-white rounded-2xl border border-zinc-200 p-4 sm:px-6 flex flex-wrap items-center justify-between gap-4">
                  <div className="flex flex-wrap gap-2">
                    {BENTO_LAYOUTS.map((l) => (
                      <button
                        key={l.id}
                        onClick={() => {
                          setLayoutId(l.id);
                          setSelectedSlotId(l.id === 'box-3slot' ? 'slot-main' : 'slot-dish');
                        }}
                        className={`px-3.5 py-2 rounded-xl text-xs font-semibold border ${
                          l.id === layoutId ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-zinc-100 text-zinc-800 border-zinc-300'
                        }`}
                      >
                        {l.nameTh}
                      </button>
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    <button
                      onClick={() => setViewMode('compartment')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                        viewMode === 'compartment' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-zinc-100 text-zinc-700 border-zinc-300'
                      }`}
                    >
                      โหมดจัดหลุมเบนโตะ (ลากสลับอิสระ)
                    </button>
                    <button
                      onClick={() => setViewMode('fullbox')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                        viewMode === 'fullbox' ? 'bg-[#C83E2B] text-white border-[#C83E2B]' : 'bg-zinc-100 text-zinc-700 border-zinc-300'
                      }`}
                    >
                      ดูภาพกล่องจริง (17 รูป)
                    </button>
                  </div>
                </div>

                {viewMode === 'compartment' ? (
                  <div className="bg-zinc-50 rounded-2xl border border-zinc-200 p-4 sm:p-6">
                    <div className="rounded-[28px] bg-zinc-900 p-3.5 sm:p-4 shadow-[0_22px_45px_-12px_rgba(0,0,0,0.35)] border-2 border-zinc-700">
                      <div className={`grid ${currentLayout.gridContainerClass} gap-3 bg-zinc-800 p-3 rounded-[20px] border border-zinc-700`}>
                        {currentLayout.slots.map((slot, idx) => {
                          const sl = slots[slot.id];
                          const isSelected = selectedSlotId === slot.id;
                          return (
                            <div
                              key={slot.id}
                              onDragOver={(e) => e.preventDefault()}
                              onDrop={() => {
                                const f = FOOD_ITEMS.find((x) => x.id === draggedFoodId);
                                if (f) placeFood(slot.id, f);
                              }}
                              onClick={() => setSelectedSlotId(slot.id)}
                              className={`${slot.gridSpanClass} ${slot.minHeightClass} relative rounded-[14px] overflow-hidden cursor-pointer flex flex-col justify-between ${
                                slot.isFoilCup ? 'border-4 border-zinc-300 bg-zinc-100' : 'border-2 border-zinc-700 bg-zinc-100'
                              } ${isSelected ? 'ring-4 ring-lime-400' : ''}`}
                            >
                              {isSelected && (
                                <div className="pointer-events-none absolute inset-2 rounded-[10px] border-2 border-dashed border-white/95 z-20" />
                              )}
                              {sl && (
                                <div className="relative w-full h-full flex-1 flex flex-col justify-between min-h-[inherit]">
                                  <div className="absolute inset-0 w-full h-full">
                                    <FoodThumb item={sl.item} selectedMeat={sl.selectedMeat} size="fill" />
                                  </div>
                                  <div className="relative z-10 p-2.5 flex flex-wrap items-center justify-between gap-1.5">
                                    <span className="px-2.5 py-1 rounded-full bg-white/95 text-zinc-900 text-xs font-bold shadow-sm border border-zinc-200">
                                      0{idx + 1} • {slot.labelTh}
                                    </span>
                                    {sl.item.availableMeats && sl.item.availableMeats.length > 1 && (
                                      <div className="flex items-center gap-1 bg-white/95 p-0.5 rounded-full shadow-sm border border-zinc-200">
                                        {sl.item.availableMeats.map((meat) => (
                                          <button
                                            key={meat}
                                            type="button"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              setSlots((prev) => ({
                                                ...prev,
                                                [slot.id]: { ...prev[slot.id], selectedMeat: meat },
                                              }));
                                            }}
                                            className={`px-2 py-0.5 rounded-full text-xs font-bold ${
                                              sl.selectedMeat === meat ? 'bg-zinc-900 text-white' : 'text-zinc-700'
                                            }`}
                                          >
                                            {meat}
                                          </button>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                  {sl.toppings.length > 0 && (
                                    <div className="relative z-10 px-4 flex items-center justify-center my-auto">
                                      {sl.toppings.map((top) => (
                                        <div key={top.id} className="relative w-28 h-28 flex items-center justify-center">
                                          {top.hasRealPhoto && top.diecutImage && (
                                            <img
                                              src={top.diecutImage}
                                              alt={top.nameTh}
                                              className="w-full h-full object-contain drop-shadow-[0_10px_14px_rgba(0,0,0,0.45)]"
                                            />
                                          )}
                                          <span className="absolute -bottom-1 right-0 bg-white text-zinc-900 border border-zinc-300 text-xs font-bold px-2.5 py-0.5 rounded-full shadow">
                                            +{top.addonPrice}฿
                                          </span>
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                  <div className="relative z-10 p-2.5 flex items-end justify-between gap-2">
                                    <span className="px-3 py-1 rounded-full bg-white/95 text-zinc-900 text-xs font-bold shadow-sm border border-zinc-200 truncate max-w-[75%]">
                                      {formatSlotTitle(sl)}
                                    </span>
                                    <span className="px-2.5 py-1 rounded-full bg-white/95 text-zinc-800 text-xs font-semibold shadow-sm border border-zinc-200 shrink-0">
                                      {sl.item.calories} kcal
                                    </span>
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="bg-zinc-50 rounded-2xl border border-zinc-200 p-4 sm:p-6">
                    <img
                      src={pricing.referenceBoxPhoto}
                      alt="Real Box"
                      className="w-full h-[400px] object-cover rounded-2xl"
                    />
                  </div>
                )}

                <div className="bg-white rounded-2xl border border-zinc-200 p-5 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <h3 className="text-base font-bold text-zinc-900">{pricing.setName}</h3>
                      <p className="text-sm text-zinc-600">
                        ราคาต่อกล่อง ฿{pricing.unitPrice} • สั่ง {boxCount} กล่อง รวมทั้งสิ้น ฿{pricing.grandTotal.toLocaleString()}
                      </p>
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                      {[1, 5, 10, 20, 50, 100].map((q) => (
                        <button
                          key={q}
                          onClick={() => setBoxCount(q)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                            boxCount === q ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-zinc-100 text-zinc-700 border-zinc-300'
                          }`}
                        >
                          {q} กล่อง
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2 pt-3 border-t border-zinc-200">
                    <button
                      onClick={downloadPng}
                      className="flex-1 py-2.5 px-4 rounded-xl text-xs font-bold bg-[#C83E2B] hover:bg-red-800 text-white"
                    >
                      บันทึกรูปกล่องข้าว + ใบสรุปราคา (.PNG) ส่ง LINE
                    </button>
                    <button
                      onClick={copyOrderSummary}
                      className="flex-1 py-2.5 px-4 rounded-xl text-xs font-bold bg-zinc-900 hover:bg-zinc-800 text-white"
                    >
                      {copiedToast ? 'คัดลอกใบสั่งซื้อเรียบร้อย!' : `คัดลอกข้อความส่ง LINE (${boxCount} กล่อง • ฿${pricing.grandTotal.toLocaleString()})`}
                    </button>
                  </div>
                </div>
              </section>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
